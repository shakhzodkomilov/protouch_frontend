[phases.setup]
nixPkgs = ["nodejs_22"]  # Updated from nodejs_20

[phases.install]
cmds = ["npm ci"]
# Removed cacheDirectories - don't cache node_modules/.cache during npm ci

[phases.build]
cmds = ["npm run build"]
cacheDirectories = [".next/cache"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3000"